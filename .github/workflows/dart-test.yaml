# Main Dart tests and checks
name: Dart test

on:
  workflow_dispatch:
  push:
    branches: [main, prerelease]
  pull_request:
    branches: [main, prerelease]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk: [3.13]
    
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install exiftool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y exiftool

      - name: Install exiftool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Install exiftool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool -y

      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        run: dart test --exclude-tags flaky
      - name: Run flaky tests (informational, non-blocking)
        run: dart test --tags flaky
        continue-on-error: true
  formatting-and-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: 3.13
      - run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown